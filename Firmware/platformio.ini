[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

; C3 Mini dung USB-CDC native, can 2 dong nay de Serial.print hien thi tren Serial Monitor
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1